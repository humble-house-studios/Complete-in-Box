# Every push to main: Godot runs the tests, exports a web build in the cloud and
# publishes it to GitHub Pages, so the newest version is one tap away on a phone.
name: Build and deploy to phone

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # Build time stamp: the TV app compares it to fetch newer game data.
      - name: Stamp build
        run: date +%s > build_id.txt

      - name: Import project
        run: godot --headless --import || true

      # GUT tests. A failing test or any script error stops the build, so a
      # broken game never reaches the play link.
      - name: Run tests
        shell: bash
        run: |
          set +e
          godot --headless -s addons/gut/gut_cmdln.gd 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E "\[Failed\]|SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Invalid get|Invalid set|Invalid operands" | head -30 | while IFS= read -r line; do
            echo "::error title=Test::${line}"
          done
          if sed 's/\x1b\[[0-9;]*m//g' test.log | grep -qE "SCRIPT ERROR|Parse Error"; then
            echo "::error title=Script errors::see the test log"
            exit 1
          fi
          exit $code

      # Balance check: a bot plays a few hundred runs. Never fails the build;
      # the summary shows up as a notice on the run.
      - name: Balance sim
        shell: bash
        run: |
          godot --headless -s res://tools/sim.gd 2>&1 | tee sim.log || true
          grep "^SIM" sim.log | while IFS= read -r line; do echo "::notice title=Balance::${line}"; done

      - name: Export web build
        shell: bash
        run: |
          mkdir -v -p build/web
          set +e
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tee export.log
          code=${PIPESTATUS[0]}
          { grep -iE "error|failed|cannot|invalid" export.log || true; } | head -20 | while IFS= read -r line; do
            echo "::warning title=Godot export::${line}"
          done
          echo "::notice title=Build output::exit=${code}; files: $(ls build/web 2>&1 | tr '\n' ' ')"
          if [ ! -f build/web/index.html ]; then
            tail -15 export.log | while IFS= read -r line; do echo "::error title=Godot log tail::${line}"; done
            exit 1
          fi

      # Android TV app: same game as a native app (the TV browser can't run the
      # web build). Never blocks the web deploy; the .apk is published next to
      # the game as tv.apk so the TV can download it with the Downloader app.
      - name: Export Android TV app
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          set +e
          JAVA_HOME_GUESS=$(dirname $(dirname $(readlink -f $(which java))))
          KS=/root/debug.keystore
          if [ ! -f "$KS" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$KS" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}
          for d in ~/.config/godot /root/.config/godot; do
            mkdir -p "$d"
            for v in 4 4.3; do
              printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$SDK" "$JAVA_HOME_GUESS" "$KS" > "$d/editor_settings-$v.tres"
            done
          done
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$KS" GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p build/android
          # Each build gets a higher version so Android accepts it as an update.
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"0.1.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg
          grep -E "^version/(code|name)" export_presets.cfg
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          # Full Gradle build: writes the manifest properly (internet permission
          # for self-update, TV launcher entry). The quick prebuilt export's
          # patched manifest would not install on the TV.
          # Accept SDK licenses up front so Gradle never waits for input.
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager "$SDK"/tools/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then yes | timeout 120 "$SDKM" --licenses >/dev/null 2>&1; fi
          # Install the Gradle build template by hand (the editor flag for it
          # never exits in headless CI): unzip android_source.zip into android/build.
          TPL=$(ls -d ~/.local/share/godot/export_templates/*.stable /root/.local/share/godot/export_templates/*.stable 2>/dev/null | head -1)
          rm -rf android && mkdir -p android/build
          unzip -q -o "$TPL/android_source.zip" -d android/build
          echo "4.3.stable" > android/.build_version
          touch android/.gdignore android/build/.gdignore
          ls android/build | head
          sed -i 's/^gradle_build\/use_gradle_build=.*/gradle_build\/use_gradle_build=true/' export_presets.cfg
          timeout 900 godot --headless --verbose --export-debug "Android TV" build/android/complete-in-box-tv.apk < /dev/null 2>&1 | tee android.log
          if [ ! -f build/android/complete-in-box-tv.apk ]; then
            tail -40 android.log | while IFS= read -r line; do echo "::warning title=Gradle tail::${line}"; done
            grep -iE "error|fail|what went wrong|BUILD" android.log | grep -v savepack | head -30 | while IFS= read -r line; do echo "::warning title=Gradle build::${line}"; done
            # Fallback: quick export without extra permissions (installs, no self-update).
            sed -i 's/^gradle_build\/use_gradle_build=.*/gradle_build\/use_gradle_build=false/; s/^permissions\/internet=.*/permissions\/internet=false/' export_presets.cfg
            godot --headless --export-debug "Android TV" build/android/complete-in-box-tv.apk 2>&1 | tail -5
            echo "::warning title=Android TV app::Gradle build failed; published a quick build without self-update"
          fi
          if [ -f build/android/complete-in-box-tv.apk ]; then
            cp build/android/complete-in-box-tv.apk build/web/tv.apk
            # Game data alone, for the TV app's self-update.
            godot --headless --export-pack "Android TV" build/web/tv-game.pck 2>&1 | tail -3
            if [ -f build/web/tv-game.pck ]; then cp build_id.txt build/web/tv-version.txt; fi
            echo "::notice title=Android TV app::tv.apk $(du -h build/android/complete-in-box-tv.apk | cut -f1)"
          else
            { grep -iE "error|fail|missing|invalid|not found|require|configur|keystore|sdk|template" android.log | grep -v savepack || tail -20 android.log; } | head -40 | while IFS= read -r line; do echo "::warning title=Android export::${line}"; done
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
