html/head_include="<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
<style>
html,body{position:fixed;left:0;top:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#15131d;overscroll-behavior:none}
#canvas{position:fixed;left:0;top:0}
</style>
<script>
/* If the game cannot start (old TV or phone browser), say why on screen instead of a blank page. */
(function(){
var box=null,t0=Date.now();
function say(msg){
if(!document.body){return setTimeout(function(){say(msg);},200);}
if(!box){box=document.createElement('div');box.style.cssText='position:fixed;left:5%;right:5%;top:30%;z-index:99999;background:#221d30;color:#f2ead8;border:3px solid #ffcc33;border-radius:10px;padding:24px;font:22px sans-serif;line-height:1.4;text-align:center';document.body.appendChild(box);}
box.innerHTML+='<p>'+msg+'</p>';
}
var c=document.createElement('canvas'),gl=null;
try{gl=c.getContext('webgl2');}catch(e){}
if(!gl){say('This browser has no WebGL 2, which the game needs to draw. Try Chrome, Firefox or Edge, or the app version.');}
if(typeof WebAssembly!=='object'){say('This browser cannot run WebAssembly. Try Chrome, Firefox or Edge.');}
var shown=0;
function crash(m){
if(/RuntimeError|memory access|unreachable/i.test(m)&&location.search.indexOf('=1')<0){
if(!shown++){say('The full graphics crashed on this device. Restarting in lite mode...');}
setTimeout(function(){location.replace(location.pathname+'?lite=1');},1500);return;
}
if(shown++<3){say('Error: '+m+(location.search?' [mode '+location.search+']':''));}
}
window.addEventListener('error',function(e){if(Date.now()-t0<600000){crash((e.message||e.type)+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':''));}});
window.addEventListener('unhandledrejection',function(e){crash(e.reason&&e.reason.message?e.reason.message:String(e.reason));});
setTimeout(function(){var cv=document.getElementById('canvas');if(cv&&cv.width<=300){say('Still loading after a minute. This device may be short on memory or very slow. Browser: '+navigator.userAgent);}},60000);
})();
</script>
<script>
(function(){
/* Edge to edge on iPhone; the game keeps clear of the notch itself (scripts/ui/safe_area.gd). */
var vp='width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover';
var m=document.querySelector('meta[name=viewport]');
if(m){m.setAttribute('content',vp);}else{m=document.createElement('meta');m.name='viewport';m.content=vp;document.head.appendChild(m);}
/* Safe-area insets in screen pixels: top,right,bottom,left. */
var probe=document.createElement('div');
probe.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
window.cibSafeInsets=function(){
if(!probe.parentNode&&document.body){document.body.appendChild(probe);}
var s=getComputedStyle(probe),d=window.devicePixelRatio||1;
return [s.paddingTop,s.paddingRight,s.paddingBottom,s.paddingLeft].map(function(v){return Math.round((parseFloat(v)||0)*d);}).join(',');
};
/* iOS reports the new window size late after a turn: nudge the game a few times. */
function nudge(){window.scrollTo(0,0);window.dispatchEvent(new Event('resize'));}
window.addEventListener('orientationchange',function(){[50,250,600,1200].forEach(function(t){setTimeout(nudge,t);});});
/* Sound: play through the speakers even with the silent switch on. */
var ctxs=[];
var AC=window.AudioContext||window.webkitAudioContext;
if(AC){
var CibAC=function(o){var c=o?new AC(o):new AC();ctxs.push(c);return c;};
CibAC.prototype=AC.prototype;
window.AudioContext=CibAC;
if(window.webkitAudioContext){window.webkitAudioContext=CibAC;}
}
var hush=new Audio('data:audio/wav;base64,');
hush.loop=true;hush.volume=0.01;hush.setAttribute('playsinline','');
function wake(){
try{if(navigator.audioSession&&navigator.audioSession.type!=='playback'){navigator.audioSession.type='playback';}}catch(e){}
try{if(hush.paused){var r=hush.play();if(r&&r.catch){r.catch(function(){});}}}catch(e){}
ctxs.forEach(function(c){try{if(c.state!=='running'){c.resume();}}catch(e){}});
}
['touchstart','touchend','pointerup','click','keydown'].forEach(function(n){document.addEventListener(n,wake,true);});
document.addEventListener('visibilitychange',wake);
})();
</script>"
